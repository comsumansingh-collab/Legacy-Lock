<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memories — LegacyLock</title>

    <link rel="stylesheet" href="memories.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="page-header">

        <a href="dashboard.html" class="logo">
            <img src="logo.png" alt="LegacyLock">
        </a>

        <div class="header-actions">

            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <i class="fa-solid fa-moon"></i>
            </button>

            <button id="logout-btn" class="logout-btn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="memories-page">

        <div class="page-top">

            <div>
                <a href="dashboard.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Dashboard
                </a>

                <h1>Memories</h1>

                <p>
                    Preserve the moments, stories and memories
                    that matter to you.
                </p>
            </div>

            <button id="add-memory-btn" class="primary-btn">
                <i class="fa-solid fa-plus"></i>
                Add Memory
            </button>

        </div>


        <!-- =========================
             MEMORY LIST
        ========================== -->
        <section class="memories-section">

            <div id="memory-list" class="memory-list">

                <!-- Empty state will be shown by JavaScript -->

            </div>

        </section>

    </main>


    <!-- =========================
         ADD / EDIT MEMORY MODAL
    ========================== -->
    <div id="memory-modal" class="modal">

        <div class="modal-overlay"></div>

        <div class="modal-card">

            <button id="close-modal" class="close-modal">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-heading">

                <div class="modal-icon">
                    <i class="fa-regular fa-image"></i>
                </div>

                <div>
                    <h2 id="modal-title">Add Memory</h2>
                    <p>
                        Add a meaningful memory to your LegacyLock.
                    </p>
                </div>

            </div>


            <!-- FORM -->
            <form id="memory-form">

                <div class="form-group">

                    <label for="memory-title">
                        Memory Title
                    </label>

                    <input
                        type="text"
                        id="memory-title"
                        name="memoryTitle"
                        placeholder="e.g. Family Trip 2025"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="memory-date">
                            Memory Date
                        </label>

                        <input
                            type="date"
                            id="memory-date"
                            name="memoryDate"
                        >

                    </div>


                    <div class="form-group">

                        <label for="memory-category">
                            Category
                        </label>

                        <select id="memory-category" name="memoryCategory">

                            <option value="Personal">
                                Personal
                            </option>

                            <option value="Family">
                                Family
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Achievement">
                                Achievement
                            </option>

                            <option value="Special">
                                Special
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label for="memory-description">
                        Description
                    </label>

                    <textarea
                        id="memory-description"
                        name="memoryDescription"
                        rows="5"
                        placeholder="Write something about this memory..."
                    ></textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        id="cancel-btn"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Memory
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="memories.js"></script>

</body>
</html>
