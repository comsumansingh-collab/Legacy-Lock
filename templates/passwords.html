<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passwords — LegacyLock</title>

    <link rel="stylesheet" href="passwords.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">

        <a href="dashboard.html" class="logo">
            <img src="logo.png" alt="LegacyLock">
        </a>

        <div class="top-actions">
            <button class="theme-btn" id="themeToggle" title="Toggle theme">
                <i class="fa-regular fa-moon"></i>
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>
        </div>

    </header>


    <!-- MAIN -->
    <main class="page-container">

        <div class="page-heading">

            <div>
                <a href="dashboard.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Dashboard
                </a>

                <h1>Passwords</h1>

                <p>
                    Keep your important digital credentials organized.
                </p>
            </div>

            <button class="add-btn" id="openModal">
                <i class="fa-solid fa-plus"></i>
                Add Password
            </button>

        </div>


        <!-- PASSWORD LIST -->
        <section class="password-section">

            <div id="passwordList" class="password-list">
                <!-- Password cards will appear here -->
            </div>

            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    <i class="fa-solid fa-key"></i>
                </div>

                <h2>No passwords added yet</h2>

                <p>
                    Add your first digital credential to keep it organized.
                </p>

                <button class="add-btn" id="emptyAddBtn">
                    <i class="fa-solid fa-plus"></i>
                    Add Password
                </button>

            </div>

        </section>

    </main>


    <!-- ADD / EDIT MODAL -->
    <div class="modal-overlay" id="passwordModal">

        <div class="modal">

            <div class="modal-header">

                <div>
                    <h2 id="modalTitle">Add Password</h2>
                    <p>Enter the credential details below.</p>
                </div>

                <button class="close-btn" id="closeModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <form id="passwordForm">

                <input type="hidden" id="editIndex">


                <div class="form-group">
                    <label for="website">
                        Website / App Name
                    </label>

                    <input
                        type="text"
                        id="website"
                        placeholder="e.g. Google, Instagram"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="username">
                        Username / Email
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username or email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="password-input">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-btn"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>


                <div class="form-group">
                    <label for="note">
                        Note <span>(Optional)</span>
                    </label>

                    <textarea
                        id="note"
                        rows="3"
                        placeholder="Add a note..."
                    ></textarea>
                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button type="submit" class="save-btn">
                        <i class="fa-solid fa-check"></i>
                        Save Password
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="passwords.js"></script>

</body>
</html>
