<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents — LegacyLock</title>

    <link rel="stylesheet" href="documents.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- HEADER -->
    <header class="topbar">

        <a href="dashboard.html" class="logo">
            <img src="logo.png" alt="LegacyLock">
        </a>

        <div class="top-actions">

            <button class="theme-btn" id="themeToggle">
                <i class="fa-regular fa-moon"></i>
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <!-- MAIN -->
    <main class="page-container">

        <div class="page-heading">

            <div>

                <a href="dashboard.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Dashboard
                </a>

                <h1>Documents</h1>

                <p>
                    Organize your important documents and records.
                </p>

            </div>

            <button class="add-btn" id="openModal">
                <i class="fa-solid fa-plus"></i>
                Add Document
            </button>

        </div>


        <!-- DOCUMENT LIST -->

        <section>

            <div id="documentList" class="document-list"></div>


            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    <i class="fa-solid fa-file-lines"></i>
                </div>

                <h2>No documents added yet</h2>

                <p>
                    Add your important documents to keep their details organized.
                </p>

                <button class="add-btn" id="emptyAddBtn">
                    <i class="fa-solid fa-plus"></i>
                    Add Document
                </button>

            </div>

        </section>

    </main>


    <!-- ADD / EDIT MODAL -->

    <div class="modal-overlay" id="documentModal">

        <div class="modal">

            <div class="modal-header">

                <div>
                    <h2 id="modalTitle">Add Document</h2>

                    <p>
                        Enter the document details below.
                    </p>
                </div>

                <button class="close-btn" id="closeModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>


            <form id="documentForm">

                <input type="hidden" id="editIndex">


                <div class="form-group">

                    <label for="documentName">
                        Document Name
                    </label>

                    <input
                        type="text"
                        id="documentName"
                        placeholder="e.g. Passport"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Identity">
                            Identity
                        </option>

                        <option value="Financial">
                            Financial
                        </option>

                        <option value="Legal">
                            Legal
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Medical">
                            Medical
                        </option>

                        <option value="Personal">
                            Personal
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="documentDate">
                            Document Date
                        </label>

                        <input
                            type="date"
                            id="documentDate"
                        >

                    </div>


                    <div class="form-group">

                        <label for="expiryDate">
                            Expiry Date
                        </label>

                        <input
                            type="date"
                            id="expiryDate"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                        <span>(Optional)</span>
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Add some details about this document..."
                    ></textarea>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        <i class="fa-solid fa-check"></i>
                        Save Document
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="documents.js"></script>

</body>
</html>
